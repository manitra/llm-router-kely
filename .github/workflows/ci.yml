name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Full test and performance suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run all tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/tests.sh | tee scripts/.tmp-ci-output.log

      - name: Write job summary
        if: always()
        shell: bash
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          args=(scripts/.tmp-ci-output.log)
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && "${TESTS_OUTCOME}" == "success" ]]; then
            args+=(--badges scripts/.tmp-ci-pages/badges)
          fi
          ./scripts/ci-summary.sh "${args[@]}"

      - name: Upload performance badge data
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: performance-badges
          path: scripts/.tmp-ci-pages
          # Temp paths are dot-prefixed (scripts/.tmp*), which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ github.run_attempt }}
          path: scripts/.tmp-ci-output.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and verify the container image
        id: container-tests
        shell: bash
        run: |
          set -o pipefail
          # Capture stderr as well: the script reports failures on stderr, and tee alone
          # would only capture stdout.
          ./scripts/container-tests.sh 2>&1 | tee scripts/.tmp-container-output.log

      # The job log and the artifacts both require repository access, so the output is
      # also published to the public job summary to make failures diagnosable.
      - name: Publish the container test output
        if: always()
        shell: bash
        env:
          TESTS_OUTCOME: ${{ steps.container-tests.outcome }}
        run: |
          log=scripts/.tmp-container-output.log
          [[ -f "$log" ]] || exit 0
          {
            echo "## Container test output (${TESTS_OUTCOME})"
            echo '```text'
            tail -c 60000 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload container test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-test-output-${{ github.run_attempt }}
          path: scripts/.tmp-container-output.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
